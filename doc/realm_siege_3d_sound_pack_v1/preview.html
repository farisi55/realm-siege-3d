function render(){const q=document.getElementById('search').value.toLowerCase();const cat=document.getElementById('category').value;content.innerHTML='';for(const [heading,catPrefix] of Object.entries(groups)){const filtered=sounds.filter(s=>s.file.startsWith(catPrefix+'/')&&(cat==='all'||cat===catPrefix)&&(s.file+' '+s.description+' '+s.id).toLowerCase().includes(q));if(!filtered.length)continue;const sec=document.createElement('section');sec.innerHTML='<h2>'+heading+' <span class="meta">('+filtered.length+')</span></h2><div class="grid"></div>';const grid=sec.querySelector('.grid');for(const s of filtered){const card=document.createElement('div');card.className='item';const left=document.createElement('div');left.innerHTML='<div class="name"></div><div class="meta"></div>';left.querySelector('.name').textContent=s.file;left.querySelector('.meta').textContent=(s.loop?'Loop':'One-shot')+' · '+s.durationSeconds+'s · '+(s.spatial?'spatial/mono':'stereo/non-spatial');const badge=document.createElement('span');badge.className='pill';badge.textContent=s.loop?'LOOP':'SFX';const player=document.createElement('audio');player.controls=true;player.preload='none';player.src=root+s.file;card.append(left,badge,player);grid.appendChild(card)}content.appendChild(sec)}}
